<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE699"/>
      <stop offset="35%" stop-color="#FFB703"/>
      <stop offset="70%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5FFBF1"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0097A7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070E20"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Medallion -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="250" cy="250" r="224" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="250" cy="250" r="214" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Compass Starburst / Latitude Rings -->
  <ellipse cx="250" cy="250" rx="140" ry="50" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.4" transform="rotate(-15 250 250)"/>
  <ellipse cx="250" cy="250" rx="140" ry="50" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3" transform="rotate(75 250 250)"/>

  <!-- Elegant Mountain Peaks -->
  <polygon points="175,260 250,140 325,260" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  <polygon points="215,260 270,175 325,260" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" opacity="0.8"/>
  <polygon points="250,140 230,195 250,210 270,195" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Flight Path & Modern Plane -->
  <path d="M 120 280 C 170 190, 310 160, 370 210" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.8"/>
  <g transform="translate(370, 210) rotate(35)">
    <path d="M 0,-14 L 5,0 L 14,3 L 5,5 L 4,14 L 0,8 L -4,14 L -5,5 L -14,3 L -5,0 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Sun / Wonder Star -->
  <circle cx="250" cy="115" r="9" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Brand Typography -->
  <text x="250" y="325" text-anchor="middle" font-family="'Cinzel', serif" font-weight="800" font-size="34" letter-spacing="8" fill="url(#goldGrad)">MARVEL</text>
  <text x="250" y="358" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="600" font-size="16" letter-spacing="12" fill="url(#cyanGrad)">HOLIDAYS</text>
  
  <!-- Subtle Tagline Arc -->
  <text x="250" y="405" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="11" letter-spacing="4" fill="#94A3B8">DISCOVER INDIA • EXPERIENCE WONDER</text>

  <!-- Stars -->
  <circle cx="160" cy="348" r="2.5" fill="#FFB703"/>
  <circle cx="340" cy="348" r="2.5" fill="#FFB703"/>
</svg>

