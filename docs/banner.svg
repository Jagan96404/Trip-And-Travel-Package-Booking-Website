<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="50%" stop-color="#09090f"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <!-- Red Marvel Glow -->
    <radialGradient id="redGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ED1D24" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#ED1D24" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Accent Glow -->
    <radialGradient id="goldGlow" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Dark Glass Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181822" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e0e14" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#ED1D24" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title-font { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .serif-font { font-family: 'Times New Roman', Times, Georgia, serif; }
    .mono-font { font-family: 'SF Mono', Consolas, Monaco, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="420" fill="url(#redGlow)"/>
  <rect width="1200" height="420" fill="url(#goldGlow)"/>

  <!-- Border Frame -->
  <rect x="12" y="12" width="1176" height="396" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Top Badge: Brand Tagline -->
  <g transform="translate(60, 48)">
    <rect width="330" height="30" rx="15" fill="#181822" stroke="#ED1D24" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="16" cy="15" r="4" fill="#ED1D24"/>
    <text x="30" y="20" fill="#fbbf24" class="mono-font" font-size="11" font-weight="600" letter-spacing="1.5">
      ASSEMBLE YOUR NEXT ADVENTURE ❤️‍🔥
    </text>
  </g>

  <!-- Star Rating Accent on Top Right -->
  <g transform="translate(980, 48)">
    <rect width="160" height="30" rx="15" fill="#181822" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="18" y="20" fill="#fbbf24" class="title-font" font-size="13">★ 4.98</text>
    <text x="68" y="20" fill="#a1a1aa" class="title-font" font-size="11">| 25k+ Trips</text>
  </g>

  <!-- OFFICIAL MARVEL HOLIDAYS LOGO -->
  <g transform="translate(60, 100)" filter="url(#logoGlow)">
    <!-- Red Box for MARVEL -->
    <rect x="0" y="0" width="190" height="58" rx="3" fill="#ED1D24"/>
    <text x="95" y="44" fill="#ffffff" class="title-font" font-size="44" letter-spacing="-1.5" text-anchor="middle">MARVEL</text>

    <!-- Framed HOLIDAYS Box -->
    <g transform="translate(196, 0)">
      <line x1="0" y1="2" x2="250" y2="2" stroke="#ffffff" stroke-width="4"/>
      <text x="125" y="44" fill="#ffffff" class="title-font" font-size="40" letter-spacing="4" text-anchor="middle">HOLIDAYS</text>
      <line x1="0" y1="56" x2="250" y2="56" stroke="#ffffff" stroke-width="4"/>
    </g>
  </g>

  <!-- Main Headline -->
  <text x="60" y="200" fill="#ffffff" class="serif-font" font-size="34" font-weight="bold">
    YOUR JOURNEY. YOUR STORY.
  </text>
  <text x="60" y="235" fill="#a1a1aa" class="title-font" font-size="15" font-weight="400">
    Premier bespoke tour specialist for Industrial Visits (IV), Corporate Retreats &amp; Family Vacations across India.
  </text>

  <!-- Specialized Offerings Pills -->
  <g transform="translate(60, 265)">
    <!-- School Trips -->
    <g transform="translate(0, 0)">
      <rect width="125" height="34" rx="8" fill="url(#badgeGrad)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="14" y="22" fill="#e4e4e7" class="title-font" font-size="12">🎒 School Trips</text>
    </g>

    <!-- College IV -->
    <g transform="translate(135, 0)">
      <rect width="135" height="34" rx="8" fill="url(#badgeGrad)" stroke="#ED1D24" stroke-opacity="0.5"/>
      <text x="14" y="22" fill="#ffffff" class="title-font" font-size="12">🎓 College IV Trips</text>
    </g>

    <!-- Corporate Retreats -->
    <g transform="translate(280, 0)">
      <rect width="155" height="34" rx="8" fill="url(#badgeGrad)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="14" y="22" fill="#e4e4e7" class="title-font" font-size="12">💼 Corporate Retreats</text>
    </g>

    <!-- Family Trips -->
    <g transform="translate(445, 0)">
      <rect width="120" height="34" rx="8" fill="url(#badgeGrad)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="14" y="22" fill="#e4e4e7" class="title-font" font-size="12">❤️ Family Trips</text>
    </g>

    <!-- Devotional Yatras -->
    <g transform="translate(575, 0)">
      <rect width="145" height="34" rx="8" fill="url(#badgeGrad)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="14" y="22" fill="#e4e4e7" class="title-font" font-size="12">🕉️ Devotional Yatras</text>
    </g>

    <!-- All-India Coverage -->
    <g transform="translate(730, 0)">
      <rect width="150" height="34" rx="8" fill="url(#badgeGrad)" stroke="#fbbf24" stroke-opacity="0.4"/>
      <text x="14" y="22" fill="#fbbf24" class="title-font" font-size="12">📍 27+ Destinations</text>
    </g>
  </g>

  <!-- Interactive Map & Tour Hub Graphic on Right -->
  <g transform="translate(900, 115)" filter="url(#shadow)">
    <rect width="240" height="180" rx="16" fill="#0d0d14" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <!-- Card header -->
    <rect width="240" height="42" rx="16" fill="#14141e"/>
    <rect x="0" y="26" width="240" height="16" fill="#14141e"/>
    <circle cx="22" cy="21" r="5" fill="#ED1D24"/>
    <text x="36" y="25" fill="#ffffff" class="mono-font" font-size="10" font-weight="700">SIGNATURE TOUR HUB</text>
    
    <!-- Kashmir info snippet -->
    <text x="18" y="70" fill="#ffffff" class="serif-font" font-size="14" font-weight="bold">Kashmir Paradise</text>
    <text x="18" y="88" fill="#71717a" class="title-font" font-size="10">6 Days • Gulmarg &amp; Dal Lake</text>
    
    <!-- Mini price -->
    <rect x="18" y="105" width="204" height="1" fill="#ffffff" fill-opacity="0.1"/>
    <text x="18" y="132" fill="#71717a" class="title-font" font-size="10">All-Inclusive From</text>
    <text x="18" y="152" fill="#fbbf24" class="serif-font" font-size="16" font-weight="bold">₹28,999</text>

    <!-- Mini button -->
    <rect x="135" y="126" width="86" height="28" rx="6" fill="#ED1D24"/>
    <text x="178" y="144" fill="#ffffff" class="title-font" font-size="10" font-weight="bold" text-anchor="middle">Book Trip →</text>
  </g>

  <!-- Bottom Direct Contact Bar -->
  <g transform="translate(30, 340)">
    <rect width="1140" height="52" rx="14" fill="#0a0a10" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    
    <!-- Call / WhatsApp -->
    <g transform="translate(40, 18)">
      <circle cx="9" cy="9" r="9" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="9" y="13" fill="#fbbf24" font-size="11" text-anchor="middle">📞</text>
      <text x="26" y="13" fill="#a1a1aa" class="mono-font" font-size="11">Call / WhatsApp:</text>
      <text x="140" y="13" fill="#ffffff" class="mono-font" font-size="12" font-weight="700">7867818790</text>
    </g>

    <line x1="320" y1="12" x2="320" y2="40" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- Email -->
    <g transform="translate(345, 18)">
      <circle cx="9" cy="9" r="9" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="9" y="13" fill="#fbbf24" font-size="11" text-anchor="middle">✉</text>
      <text x="26" y="13" fill="#a1a1aa" class="mono-font" font-size="11">Email:</text>
      <text x="75" y="13" fill="#ffffff" class="mono-font" font-size="12" font-weight="700">marvelholidaysandtours@gmail.com</text>
    </g>

    <line x1="710" y1="12" x2="710" y2="40" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- Instagram -->
    <g transform="translate(735, 18)">
      <circle cx="9" cy="9" r="9" fill="#fbbf24" fill-opacity="0.15"/>
      <text x="9" y="13" fill="#fbbf24" font-size="11" text-anchor="middle">📷</text>
      <text x="26" y="13" fill="#a1a1aa" class="mono-font" font-size="11">Instagram:</text>
      <text x="100" y="13" fill="#fbbf24" class="mono-font" font-size="12" font-weight="700">@marvel_holidays.official</text>
    </g>
  </g>
</svg>